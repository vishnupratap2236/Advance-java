# ShopSphere local configuration example
#
# Copy this file to config/db.properties and fill in the real values, then point the
# application at it with the SHOPSPHERE_CONFIG environment variable (or the JVM
# property -Dshopsphere.config=...).
#
# config/db.properties is listed in .gitignore and must never be committed.
#
# Every value can also be supplied through an environment variable:
#   DB_URL, DB_USER, DB_PASSWORD
# or through a system property, which takes precedence over everything else:
#   -Dshopsphere.db.url=... -Dshopsphere.db.user=... -Dshopsphere.db.password=...

db.url=jdbc:mysql://localhost:3306/shopsphere?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
db.user=shopsphere_app
db.password=CHANGE_ME

# Connection pool
db.poolSize=12
db.connectionTimeoutMs=20000
db.migrateOnStartup=true

# Store settings
app.name=ShopSphere
currency=₹
timezone=Asia/Kolkata

# Commerce rules
shipping.fee=99.00
shipping.freeThreshold=4999.00
tax.rate=0.05

# Security
security.maxLoginAttempts=5
security.loginLockoutMinutes=15

# First administrator. Leave the password empty here and use the AdminUserCreator
# tool instead if you do not want the account to be created automatically.
admin.email=admin@shopsphere.local
admin.password=
admin.name=Store Administrator
